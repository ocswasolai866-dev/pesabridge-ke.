<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PesaBridge · 25% Client Contribution Loan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #eef2f9 0%, #f8fafd 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .loan-card {
      max-width: 920px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.25), 0 8px 20px -8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .loan-card:hover {
      transform: scale(1.002);
    }

    /* ===== HEADER ===== */
    .card-header {
      padding: 2rem 2.5rem 0.5rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.6rem;
      box-shadow: 0 8px 18px -6px rgba(30, 60, 114, 0.4);
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      color: #0b1e3a;
      line-height: 1.15;
    }

    .logo-text span {
      color: #1e3c72;
      font-weight: 800;
    }

    .logo-tagline {
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      color: #7b93aa;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .location-badge {
      background: #ffffff;
      color: #25415f;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid #dae5f0;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .location-badge:hover {
      border-color: #1e3c72;
      background: #f7faff;
    }

    .location-badge i {
      font-size: 0.85rem;
      color: #1e3c72;
    }

    .location-badge .currency-code {
      background: #1e3c72;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
    }

    .currency-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 40px -10px rgba(10, 30, 60, 0.25);
      border: 1.5px solid #dae5f0;
      min-width: 230px;
      padding: 8px;
      z-index: 100;
      display: none;
      max-height: 320px;
      overflow-y: auto;
    }

    .currency-dropdown.show {
      display: block;
      animation: slideDown 0.2s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .currency-dropdown .dropdown-header {
      padding: 8px 12px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #7b93aa;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .currency-option {
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #25415f;
      transition: background 0.15s;
    }

    .currency-option:hover {
      background: #f0f6ff;
    }

    .currency-option.active {
      background: #e8f0fe;
      color: #1e3c72;
      font-weight: 700;
    }

    .currency-option .opt-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .currency-option .flag {
      font-size: 1.15rem;
    }

    .currency-option .opt-code {
      font-weight: 600;
      color: #7b93aa;
      font-size: 0.8rem;
    }

    .currency-option.active .opt-code {
      color: #1e3c72;
    }

    .badge {
      background: #e3eefc;
      color: #1e3c72;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #cbdff5;
    }

    .badge i {
      font-size: 0.9rem;
      color: #2a5ea7;
    }

    /* ===== BODY ===== */
    .card-body {
      padding: 1.2rem 2.5rem 2.5rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .intro h2 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #0b1e3a;
      letter-spacing: -0.03em;
      margin-bottom: 0.25rem;
    }

    .intro p {
      color: #546e8a;
      font-size: 1rem;
      line-height: 1.5;
      font-weight: 400;
    }

    .highlight {
      font-weight: 700;
      color: #1e3c72;
      background: #e9f0fe;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      display: inline-block;
    }

    .loan-layout {
      display: grid;
      grid-template-columns: 1fr 0.9fr;
      gap: 2rem;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .input-group label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1a304c;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-group label i {
      color: #2f5b9c;
      font-size: 0.95rem;
      width: 18px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .currency-symbol {
      position: absolute;
      left: 18px;
      font-weight: 600;
      color: #546e8a;
      font-size: 1.05rem;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border: 1.5px solid #dae5f0;
      border-radius: 18px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #0b1e3a;
      background: #fbfdff;
      transition: all 0.2s;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: #1e3c72;
      box-shadow: 0 0 0 4px rgba(30, 60, 114, 0.1);
      background: #ffffff;
    }

    .input-wrapper input:hover {
      border-color: #b7cde0;
    }

    .slider-container {
      margin-top: 0.2rem;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, #1e3c72 0%, #1e3c72 var(--range-progress, 30%), #e1eaf1 var(--range-progress, 30%));
      border-radius: 20px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 20, 50, 0.25);
      border: 2px solid #1e3c72;
      cursor: pointer;
      transition: 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      background: #f0f6ff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 20, 50, 0.25);
      border: 2px solid #1e3c72;
      cursor: pointer;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #7b93aa;
      margin-top: 0.5rem;
      font-weight: 500;
    }

    /* Summary Section */
    .summary-section {
      background: #f7faff;
      border-radius: 2rem;
      padding: 1.8rem 1.6rem;
      border: 1.5px solid #dce8f5;
      box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.8), 0 8px 18px -8px rgba(20, 40, 70, 0.1);
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
    }

    .summary-title {
      font-weight: 700;
      font-size: 1.2rem;
      color: #0b1e3a;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px dashed #bdd0e6;
      padding-bottom: 0.8rem;
    }

    .summary-title i {
      color: #1e3c72;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      color: #25415f;
      font-weight: 500;
      padding: 0.3rem 0;
      gap: 10px;
    }

    .summary-row .label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3f5e7c;
      flex-shrink: 0;
    }

    .summary-row .label i {
      width: 18px;
      color: #2f5b9c;
      font-size: 0.95rem;
    }

    .summary-row .value {
      font-weight: 700;
      color: #0b1e3a;
      font-size: 1.1rem;
      text-align: right;
    }

    .summary-row.highlight-row {
      background: #e8f0fe;
      padding: 0.8rem 1rem;
      border-radius: 18px;
      margin: 0.2rem 0;
      border: 1px solid #c2d9f0;
    }

    .summary-row.highlight-row .value {
      color: #1e3c72;
      font-size: 1.25rem;
    }

    .summary-row.rate-row {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 18px;
      padding: 0.8rem 1rem;
      margin: 0.2rem 0;
    }

    .summary-row.rate-row .value {
      color: #c2410c;
      font-size: 1.15rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, #d0e0f0, transparent);
      margin: 0.2rem 0;
    }

    .client-portion {
      background: #eaf1fb;
      border-radius: 16px;
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      color: #1b3b62;
      font-weight: 500;
      border-left: 5px solid #1e3c72;
      flex-wrap: wrap;
    }

    .client-portion i {
      font-size: 1.2rem;
      color: #1e3c72;
    }

    /* Payment Section */
    .payment-section {
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border: 2px solid #86efac;
      border-radius: 24px;
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .payment-section::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.14), transparent 70%);
      border-radius: 50%;
    }

    .payment-header {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .payment-icon {
      width: 44px;
      height: 44px;
      background: #16a34a;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
      box-shadow: 0 8px 16px -6px rgba(22, 163, 74, 0.5);
      flex-shrink: 0;
    }

    .payment-header-text h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #14532d;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }

    .payment-header-text p {
      font-size: 0.85rem;
      color: #166534;
      font-weight: 500;
    }

    .till-card {
      background: white;
      border: 2px dashed #22c55e;
      border-radius: 20px;
      padding: 1.2rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    .till-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .till-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }

    .till-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: #15803d;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .till-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: #14532d;
      letter-spacing: -0.3px;
      line-height: 1.15;
      word-break: break-word;
    }

    .till-number-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .till-number {
      font-size: 1.7rem;
      font-weight: 800;
      color: #15803d;
      letter-spacing: 3px;
      font-family: 'Courier New', monospace;
      background: #f0fdf4;
      padding: 0.3rem 0.9rem;
      border-radius: 12px;
      border: 1px solid #bbf7d0;
    }

    .copy-btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 0.7rem 1.1rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #15803d;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -6px rgba(22, 163, 74, 0.4);
    }

    .copy-btn:active {
      transform: translateY(0);
    }

    .copy-btn.copied {
      background: #15803d;
    }

    .payment-amount-highlight {
      background: #dcfce7;
      padding: 0.8rem 1.1rem;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: #14532d;
      position: relative;
      z-index: 1;
      flex-wrap: wrap;
      gap: 6px;
    }

    .payment-amount-highlight .amt {
      font-size: 1.2rem;
      font-weight: 800;
      color: #15803d;
    }

    .payment-steps {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      position: relative;
      z-index: 1;
    }

    .payment-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.85rem;
      color: #166534;
      font-weight: 500;
      line-height: 1.45;
    }

    .step-num {
      background: #dcfce7;
      color: #15803d;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .pay-now-btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      position: relative;
      z-index: 1;
      margin-top: 0.3rem;
      box-shadow: 0 12px 22px -8px rgba(22, 163, 74, 0.5);
    }

    .pay-now-btn:hover {
      background: #15803d;
      transform: translateY(-2px);
      box-shadow: 0 18px 28px -10px rgba(22, 163, 74, 0.5);
    }

    .pay-now-btn:active {
      transform: translateY(1px);
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1rem 2rem;
      border-radius: 50px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1 1 auto;
      letter-spacing: 0.01em;
    }

    .btn-primary {
      background: #1e3c72;
      color: white;
      box-shadow: 0 10px 18px -8px rgba(30, 60, 114, 0.4);
    }

    .btn-primary:hover {
      background: #142c55;
      transform: translateY(-2px);
      box-shadow: 0 18px 25px -10px rgba(20, 50, 100, 0.4);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: white;
      color: #1e3c72;
      border: 1.5px solid #cddef0;
    }

    .btn-secondary:hover {
      background: #f5faff;
      border-color: #9bb9db;
      transform: translateY(-2px);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 45, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: white;
      border-radius: 28px;
      max-width: 440px;
      width: 100%;
      padding: 2rem 2rem 1.8rem 2rem;
      box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.5);
      text-align: center;
      transform: scale(0.92) translateY(10px);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      position: relative;
    }

    .modal-overlay.show .modal-box {
      transform: scale(1) translateY(0);
    }

    .modal-icon-wrap {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #f0fdf4;
      border: 3px solid #86efac;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem auto;
      animation: pulseRing 2s infinite;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.35); }
      70% { box-shadow: 0 0 0 16px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .modal-icon-wrap i {
      font-size: 2.1rem;
      color: #16a34a;
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0b1e3a;
      margin-bottom: 0.6rem;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .modal-message {
      font-size: 1rem;
      color: #546e8a;
      font-weight: 500;
      line-height: 1.55;
      margin-bottom: 1.4rem;
    }

    .modal-message .pay-amount {
      color: #15803d;
      font-weight: 800;
      font-size: 1.15rem;
      background: #f0fdf4;
      padding: 0.15rem 0.6rem;
      border-radius: 12px;
      display: inline-block;
    }

    .modal-message .pay-to {
      color: #14532d;
      font-weight: 800;
    }

    .modal-detail-box {
      background: #f7faff;
      border: 1.5px solid #dce8f5;
      border-radius: 18px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      text-align: left;
    }

    .modal-detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      gap: 10px;
    }

    .modal-detail-row .d-label {
      color: #7b93aa;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .modal-detail-row .d-label i {
      width: 15px;
      color: #2f5b9c;
      font-size: 0.82rem;
    }

    .modal-detail-row .d-value {
      color: #0b1e3a;
      font-weight: 700;
      text-align: right;
    }

    .modal-detail-row .d-value.amount {
      color: #15803d;
      font-size: 1rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
    }

    .modal-btn {
      flex: 1;
      padding: 0.95rem 1rem;
      border-radius: 50px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap:
